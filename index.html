<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponte das Frações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA 1: MENU INICIAL -->
  <div id="tela1" class="tela ativa">
    <button class="btn-principal" onclick="irParaTela('tela2')">INICIAR</button>
  </div>

  <!-- TELA 2: TUTORIAL -->
  <div id="tela2" class="tela">
    <div class="balao-tutorial">
      <p id="texto-tutorial">Ajude o Príncipe a construir 10 pontes sobre os abismos para salvar a Princesa no topo da montanha!</p>
    </div>
    <button class="btn-principal" onclick="iniciarJogo()">VAMOS JOGAR</button>
  </div>

  <!-- TELA 3: GAMEPLAY (FASES 1 A 10) -->
  <div id="tela3" class="tela">
    <!-- Cabeçalho com estatísticas -->
    <div id="hud">
      <span id="txt-fase">Fase: 1/10</span>
      <span id="txt-vidas">❤️ ❤️ ❤️</span>
      <span id="txt-pontos">Pontos: 0</span>
    </div>

    <!-- Área da Ponte e Personagens -->
    <div id="area-jogo">
      <img id="img-principe" src="assets/imagens/principe.png" alt="Príncipe">
      
      <!-- Cartão Alvo do Abismo -->
      <div id="cartao-alvo">
        <span>ALVO DO ABISMO</span>
        <h2 id="valor-alvo">3/4</h2>
      </div>

      <img id="img-princesa" src="assets/imagens/princesa.png" alt="Princesa">
    </div>

    <!-- Painel de Seleção das Frações -->
    <div id="painel-soma">
      <p>Soma Selecionada: <strong id="valor-soma">0</strong></p>
    </div>

    <div id="grade-blocos">
      <!-- 5 Botões de Fração gerados via JS -->
    </div>

    <div id="controles-jogo">
      <button class="btn-acao btn-limpar" onclick="limparSelecao()">LIMPAR</button>
      <button class="btn-acao btn-testar" onclick="testarPonte()">TESTAR PONTE</button>
    </div>
  </div>

  <!-- TELA 4: VITÓRIA FINAL -->
  <div id="tela4" class="tela">
    <div class="painel-vitoria">
      <h1>🏆 VOCÊ VENCEU!</h1>
      <p>O Príncipe conseguiu atravessar todas as pontes e salvou a Princesa!</p>
      <h3 id="pontuacao-final">Pontuação Final: 100 PTS</h3>
      <button class="btn-principal" onclick="irParaTela('tela1')">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <!-- ÁUDIOS DO JOGO -->
  <audio id="som-vitoria" src="assets/sons/vitoria.mp3"></audio>
  <audio id="som-erro" src="assets/sons/erro.mp3"></audio>
  <audio id="som-clique" src="assets/sons/clique.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
